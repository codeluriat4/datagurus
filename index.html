const card=document.getElementById('card'),phone=document.getElementById('phone');
const mk=(k,par)=>{const d=P[k],i=new Image();i.src=d.src;i.alt='';i.draggable=false;i.style.cssText=`position:absolute;left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px`;(par||card).appendChild(i);return i};
const grp=(css,par)=>{const g=document.createElement('div');g.style.cssText='position:absolute;left:0;top:0;width:1254px;height:1254px;'+css;(par||card).appendChild(g);return g};
const NS='http://www.w3.org/2000/svg';
const sv=(par,html)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 1254 1254');s.setAttribute('width',1254);s.setAttribute('height',1254);s.style.cssText='position:absolute;left:0;top:0;overflow:visible;pointer-events:none';s.innerHTML=html;par.appendChild(s);return s};

const drops=['dn2','dn5','dk0'].map(k=>mk(k,bg));

const st=document.createElement('style');st.textContent=`.s0{background-image:url(${P.line0.src})}.s1{background-image:url(${P.line1.src})}.s0,.s1{position:absolute;background-repeat:no-repeat;will-change:transform}`;document.head.appendChild(st);
const strips=[];
['line0','line1'].forEach((k,li)=>{const d=P[k];for(let x=0;x<d.w;x+=6){const s=document.createElement('div');s.className='s'+li;s.style.cssText=`left:${d.x+x}px;top:${d.y}px;width:${Math.min(7,d.w-x)}px;height:${d.h}px;background-position:${-x}px 0`;bg.appendChild(s);strips.push({s,x:d.x+x,li})}});

const T=6.4,LIFT=22,TILT=-2.2;

  const dt=Math.min(.05,(now-last)/1000);last=now;if(run)tt+=dt;
  const t=tt%T,w=tt;
  const e=ss((t-1.4)/.8)-ss((t-3.8)/.8);
  const bl=(a)=>{const u=(t-a)/.14;return u>0&&u<1?1-Math.abs(2*u-1):0};
  const close=Math.max(ss((e-.45)/.3),bl(.6),bl(5.4));
  cg.style.transform=`translateY(${-LIFT*e+Math.sin(w*9)*.5*e}px) rotate(${TILT*e}deg)`;
  eg.style.opacity=close;
  wp.forEach((p,i)=>{const[x,y,o]=wisp[i],u=(w*.32+o)%1;p.setAttribute('transform',`translate(${x+Math.sin(u*6+i)*7},${y-u*58}) scale(.8)`);p.style.opacity=Math.sin(Math.PI*u)*(.25+.5*e)});
  bg.style.transform=`translateY(${Math.sin(w*1.1)*5}px) rotate(${Math.sin(w*.7)*.6}deg)`;
  strips.forEach(o=>o.s.style.transform=`translateY(${Math.sin(w*2.6-o.x*.035+o.li*.9)*4.5}px)`);
  sun.style.transform=`translateY(${Math.sin(w*1.8)*2}px) scale(${1+Math.sin(w*2.2)*.035})`;
  drops.forEach((d,i)=>d.style.transform=`translate(${Math.sin(w*1.3+i*2)*3}px,${Math.cos(w*1.6+i)*4}px) rotate(${Math.sin(w*1.2+i)*5}deg)`);
  requestAnimationFrame(frame)}
function fit(){const w=phone.clientWidth,h=phone.clientHeight,k=Math.min(w/1254*1.04,h/1254);card.style.transform=`translate(${(w-1254*k)/2}px,${(h-1254*k)/2}px) scale(${k})`}
addEventListener('resize',fit);fit();
card.addEventListener('click',()=>{run=!run});
requestAnimationFrame(frame);
</script></body></html>
